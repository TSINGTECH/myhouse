<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>房源后台 · My House</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF3E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">
<header class="a-top">
  <div class="a-top__l">
    <a class="logo" href="index.html"><span class="logo__mark">MY<br>HOUSE</span><span class="logo__txt"><b>房源后台</b><small>My House Imobiliária</small></span></a>
    <span class="demo-badge">演示版 · 数据只存在这台设备的浏览器里</span>
  </div>
  <div class="a-top__r">
    <a class="btn btn--sm" href="index.html" target="_blank" id="viewSite"></a>
    <button class="btn btn--sm" id="resetBtn">重置演示数据</button>
  </div>
</header>

<div class="a-shell">
  <aside class="a-side">
    <h4>按区域</h4>
    <nav id="regionNav"></nav>
  </aside>

  <main class="a-main">
    <div class="a-stats" id="stats"></div>
    <div class="a-bar">
      <input class="search" id="q" type="search" placeholder="搜索 Cod、标题、亮点">
      <select class="select" id="fType"></select>
      <select class="select" id="fStatus"></select>
      <button class="btn btn--accent a-add" id="addBtn"></button>
    </div>
    <div class="a-list" id="list"></div>
  </main>
</div>

<!-- 编辑面板 -->
<div class="a-modal" id="editor" hidden>
  <form class="a-panel" id="form" novalidate>
    <div class="a-panel__head"><h2 id="edTitle">新增房源</h2><button type="button" class="icon-btn" data-close aria-label="关闭"></button></div>
    <div class="a-panel__body" id="edBody"></div>
    <div class="a-panel__foot">
      <span class="a-err" id="formErr" role="alert"></span>
      <button type="button" class="btn" data-close>取消</button>
      <button type="submit" class="btn btn--ink">保存</button>
    </div>
  </form>
</div>

<!-- 文案生成 -->
<div class="a-modal" id="caption" hidden>
  <div class="a-panel a-panel--narrow">
    <div class="a-panel__head"><h2>生成发布文案</h2><button type="button" class="icon-btn" data-close aria-label="关闭"></button></div>
    <div class="a-panel__body" id="capBody"></div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
